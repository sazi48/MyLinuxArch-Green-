general {
    hide_cursor = true
}

background {
    monitor =
    path = LOCKSCREEN_PATH
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Watch
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 120
    font_family = sans-serif
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Data
label {
    monitor =
    text = cmd[update:60000] date "+%d %B %Y"
    color = rgba(255, 255, 255, 0.7)
    font_size = 28
    font_family = sans-serif
    position = 0, 110
    halign = center
    valign = center
}

# Input search
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = Enter password...
    position = 0, -120
    halign = center
    valign = center
    rounding = 15
}
